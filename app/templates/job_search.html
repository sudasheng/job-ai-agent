{% extends "base.html" %}
{% block title %}岗位搜索 - 求职 AI 助手{% endblock %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>岗位搜索</h1>
        <p>基于 Boss 直聘实时数据，搜索你感兴趣的岗位</p>
    </div>

    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="searchKeyword" placeholder="输入搜索关键词，如 Python后端开发" class="search-input">
            <input type="text" id="searchCity" placeholder="城市（可选）" class="search-input city-input">
            <button id="searchBtn" class="btn btn-primary">搜索岗位</button>
        </div>

        <div class="search-tip">
            <p>提示：首次使用需先在 Boss 直聘扫码登录。也可以直接输入岗位 URL 进行抓取。</p>
            <div class="url-search">
                <input type="text" id="jobUrl" placeholder="或粘贴岗位 URL 直接抓取" class="search-input">
                <button id="scrapeUrlBtn" class="btn btn-secondary">抓取详情</button>
            </div>
        </div>
    </div>

    <div class="search-status" id="searchStatus"></div>

    <div class="job-list" id="jobList">
        <div class="empty-state">
            <p>输入关键词开始搜索岗位</p>
        </div>
    </div>

    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchBtn = document.getElementById('searchBtn');
    const scrapeUrlBtn = document.getElementById('scrapeUrlBtn');
    const searchKeyword = document.getElementById('searchKeyword');
    const searchCity = document.getElementById('searchCity');
    const jobUrl = document.getElementById('jobUrl');
    const searchStatus = document.getElementById('searchStatus');
    const jobList = document.getElementById('jobList');
    const pagination = document.getElementById('pagination');

    let currentPage = 1;

    // 搜索岗位
    searchBtn.addEventListener('click', async function() {
        const keyword = searchKeyword.value.trim();
        if (!keyword) {
            searchStatus.innerHTML = '<div class="message error">请输入搜索关键词</div>';
            return;
        }

        searchStatus.innerHTML = '<div class="message info">正在搜索中...</div>';
        jobList.innerHTML = '<div class="loading">加载中...</div>';

        try {
            const token = localStorage.getItem('token');
            const resp = await fetch('/api/v1/jobs/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                },
                body: JSON.stringify({
                    keyword: keyword,
                    city: searchCity.value.trim() || null,
                    page: currentPage
                })
            });
            const result = await resp.json();

            if (resp.ok) {
                searchStatus.innerHTML = '<div class="message success">' + result.message + '</div>';
                loadJobs();
            } else {
                searchStatus.innerHTML = '<div class="message error">' + (result.message || '搜索失败') + '</div>';
            }
        } catch (err) {
            searchStatus.innerHTML = '<div class="message error">网络错误: ' + err.message + '</div>';
        }
    });

    // 抓取详情
    scrapeUrlBtn.addEventListener('click', async function() {
        const url = jobUrl.value.trim();
        if (!url) {
            searchStatus.innerHTML = '<div class="message error">请输入岗位 URL</div>';
            return;
        }

        searchStatus.innerHTML = '<div class="message info">正在抓取详情...</div>';

        try {
            const token = localStorage.getItem('token');
            const resp = await fetch('/api/v1/jobs/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? 'Bearer ' + token : ''
                },
                body: JSON.stringify({ keyword: 'url', url: url })
            });
            const result = await resp.json();

            if (resp.ok) {
                searchStatus.innerHTML = '<div class="message success">' + result.message + '</div>';
                loadJobs();
            } else {
                searchStatus.innerHTML = '<div class="message error">' + (result.message || '抓取失败') + '</div>';
            }
        } catch (err) {
            searchStatus.innerHTML = '<div class="message error">网络错误: ' + err.message + '</div>';
        }
    });

    // 加载岗位列表
    async function loadJobs(page = 1) {
        try {
            const resp = await fetch('/api/v1/jobs?page=' + page + '&page_size=20');
            const result = await resp.json();

            if (resp.ok && result.data) {
                renderJobs(result.data);
            }
        } catch (err) {
            console.error('加载岗位列表失败:', err);
        }
    }

    // 渲染岗位列表
    function renderJobs(data) {
        if (!data.items || data.items.length === 0) {
            jobList.innerHTML = '<div class="empty-state"><p>暂无岗位数据，请先搜索</p></div>';
            return;
        }

        let html = '';
        data.items.forEach(function(job) {
            html += '<div class="job-card" onclick="window.location.href=\'#\'">';
            html += '  <div class="job-card-header">';
            html += '    <h3 class="job-title">' + escapeHtml(job.title) + '</h3>';
            html += '    <span class="job-salary">' + (job.salary_desc || '薪资面议') + '</span>';
            html += '  </div>';
            html += '  <div class="job-company">' + escapeHtml(job.company_name) + '</div>';
            html += '  <div class="job-meta">';
            if (job.city) html += '<span>' + escapeHtml(job.city) + '</span>';
            if (job.experience) html += '<span>' + escapeHtml(job.experience) + '</span>';
            if (job.education) html += '<span>' + escapeHtml(job.education) + '</span>';
            html += '  </div>';
            if (job.tags && job.tags.length > 0) {
                html += '  <div class="job-tags">';
                job.tags.forEach(function(tag) {
                    html += '<span class="tag">' + escapeHtml(tag) + '</span>';
                });
                html += '  </div>';
            }
            html += '</div>';
        });

        jobList.innerHTML = html;

        // 分页
        if (data.total_pages > 1) {
            let pagHtml = '';
            for (let i = 1; i <= data.total_pages; i++) {
                pagHtml += '<button class="page-btn ' + (i === data.page ? 'active' : '') + '" onclick="loadJobs(' + i + ')">' + i + '</button>';
            }
            pagination.innerHTML = pagHtml;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始加载
    loadJobs();
});
</script>
{% endblock %}
